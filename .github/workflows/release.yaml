name: Build Release

# Builds the downloadable Companion module (.tgz) and publishes it on the Releases page.
# Runs when changes land on the master branch, or by hand from the Actions tab.
# The version in package.json must be higher than the latest release, otherwise this stops with an error.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Check the version is higher than the last release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW=$(node -p "require('./package.json').version")
          LAST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""' | sed 's/^v//')
          echo "package.json version: $NEW   latest release: ${LAST:-none}"
          if [ -n "$LAST" ]; then
            HIGHEST=$(printf '%s\n%s\n' "$LAST" "$NEW" | sort -V | tail -n1)
            if [ "$NEW" = "$LAST" ] || [ "$HIGHEST" != "$NEW" ]; then
              echo "::error::Version $NEW is not higher than the latest release ($LAST). Raise the version in package.json."
              exit 1
            fi
          fi
          echo "VERSION=$NEW" >> "$GITHUB_ENV"

      - run: yarn install --frozen-lockfile

      - run: yarn package

      - name: Check the package version matches
        run: |
          FILE=$(ls vizio-smartcast-*.tgz)
          tar -xzOf "$FILE" pkg/companion/manifest.json | grep -F "\"version\":\"$VERSION\"" \
            || { echo "::error::Version inside $FILE does not match $VERSION"; exit 1; }
          echo "PACKAGE=$FILE" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "$PACKAGE" --title "v$VERSION" --latest --generate-notes
